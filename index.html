<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khadija Pickles - Bangalore</title>
<style>
body{font-family:Arial;margin:0;background:#fff8f0}
.header{background:#8B0000;color:white;text-align:center;padding:15px;font-size:22px;font-weight:bold;position:sticky;top:0;z-index:10}
.sub{font-size:13px;font-weight:normal}
.gps-box{background:#e8f5e9;border:2px solid #4CAF50;padding:10px;margin:10px;border-radius:10px;text-align:center;font-weight:bold}
.product{border:2px solid #8B0000;margin:15px;border-radius:12px;padding:15px;text-align:center;background:white}
.btn{background:#8B0000;color:white;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer;margin:5px}
.cart-box{border:2px solid #8B0000;margin:15px;border-radius:12px;padding:15px;background:white}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
.payBtn{background:green;color:white;width:100%;padding:15px;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<div class="header">🌶️ KHADIJA PICKLES - BLR 🌶️<br><span class="sub">Virgonagar, Bangalore - 560049</span></div>
<div id="gps" class="gps-box">📍 Auto Detecting...</div>

<div class="product">
<h3>🍗 Chicken Pickle 250g<br>Rs 350</h3>
<button class="btn" onclick="addCart('Chicken Pickle 250g',350)">Add 250g - 350</button>
</div>

<div class="product" style="border-color:green">
<h3>🐐 MUTTON PICKLE</h3>
<button class="btn" onclick="addCart('Mutton Pickle 250g',650)">250g - Rs 650</button><br>
<button class="btn" style="background:green" onclick="addCart('Mutton Pickle 500g',1250)">500g - Rs 1250</button><br>
<button class="btn" style="background:black" onclick="addCart('Mutton Pickle 1KG',2400)">1KG - Rs 2400</button>
</div>

<div class="cart-box">
<h3>🛒 Cart</h3>
<div id="cartItems">Cart is empty</div>
<div id="delInfo" style="margin:10px 0;font-weight:bold">Delivery: Calculating...</div>
<div id="total" style="font-size:20px;font-weight:bold;color:#8B0000;display:none">Total: Rs 0</div>
<input id="cName" placeholder="Your Name">
<input id="cPhone" placeholder="Phone">
<input id="cAddr" placeholder="Full Address">
<div id="qrBox" style="text-align:center;margin:15px 0;display:none">
<img id="qrImg" src="" width="200" height="200" style="border:1px solid #ccc;border-radius:10px">
<p id="upiText" style="font-size:11px;word-break:break-all"></p>
</div>
<button class="payBtn" onclick="payNow()">✅ Pay & Send WhatsApp</button>
</div>

<script>
const SHOP_LAT=13.049573; const SHOP_LNG=77.711;
let deliveryKM=1.1; let deliveryCharge=30; let cart=[];
function calcDistance(lat1,lon1,lat2,lon2){const R=6371;const dLat=(lat2-lat1)*Math.PI/180;const dLon=(lon2-lon1)*Math.PI/180;const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function getDeliveryCharge(km){if(km<=3) return 30; return 30+Math.ceil(km-3)*8;}
function updateGPS(){if(navigator.geolocation){navigator.geolocation.getCurrentPosition(pos=>{deliveryKM=calcDistance(SHOP_LAT,SHOP_LNG,pos.coords.latitude,pos.coords.longitude);deliveryCharge=getDeliveryCharge(deliveryKM);document.getElementById("gps").innerHTML=`📍 You are ${deliveryKM.toFixed(1)} KM away`;render();},err=>{document.getElementById("gps").innerHTML=`📍 Delivery: Virgonagar 560049 (GPS off)`;render();});}}
function addCart(name,price){let f=cart.find(i=>i.name==name);if(f) f.qty++; else cart.push({name,price,qty:1});render();}
function render(){let html="";let total=0;if(cart.length==0){html="Cart is empty";}else{cart.forEach((item,idx)=>{total+=item.price*item.qty;html+=`${item.name} x ${item.qty} = Rs ${item.price*item.qty} <button onclick="cart.splice(${idx},1);render()">X</button><br>`;});}document.getElementById("cartItems").innerHTML=html;document.getElementById("delInfo").innerHTML=`Delivery (${deliveryKM.toFixed(1)} KM): Rs ${deliveryCharge}`;let totPay=cart.length==0?0:total+deliveryCharge;document.getElementById("total").innerHTML=`Total: Rs ${totPay}`;document.getElementById("total").style.display=cart.length==0?"none":"block";document.getElementById("qrBox").style.display=cart.length==0?"none":"block";if(cart.length>0){let upi=`upi://pay?pa=9652277926-7@ybl&pn=Khadija%20Pickles&am=${totPay}&cu=INR`;document.getElementById("qrImg").src=`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upi)}`;document.getElementById("upiText").innerText=`UPI: 9652277926-7@ybl | Rs ${totPay} | ${deliveryKM.toFixed(1)}KM`;}}
function payNow(){if(cart.length==0){alert("Add pickle first!");return;}let name=document.getElementById("cName").value;let phone=document.getElementById("cPhone").value;let addr=document.getElementById("cAddr").value;if(!name||!phone||!addr){alert("Fill Name Phone Address");return;}let msg=`Hi Khadija Pickles BLR%0AName:${name}%0APhone:${phone}%0AAddress:${addr}%0A${document.getElementById("cartItems").innerText}%0A${document.getElementById("delInfo").innerText}%0A${document.getElementById("total").innerText}`;window.open(`https://wa.me/919652277926?text=${msg}`,"_blank");}
updateGPS();render();
</script>
</body>
</html>
